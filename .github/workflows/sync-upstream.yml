name: Sync upstream

on:
  schedule:
    # GitHub 使用 UTC；每月 1 日 18:00 UTC 即北京时间次日 02:00。
    # 可按需替换为任意合法 cron，例如每周一 18:00 UTC："0 18 * * 1"。
    - cron: "0 18 1 * *"
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: Upstream branch to sync
        required: false
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Merge upstream and push
        env:
          UPSTREAM_REPO: https://github.com/Cai-aa/CAE-Agent-Hub.git
          UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'main' }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_REPO"
          git fetch --prune upstream "$UPSTREAM_BRANCH"

          # 仅合并上游，不强制重置 fork，保留 fork 自有提交。
          git checkout "${GITHUB_REF_NAME}"
          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo "Fork is already up to date."
            exit 0
          fi

          git merge --no-edit --no-ff "upstream/${UPSTREAM_BRANCH}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
